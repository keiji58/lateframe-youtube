<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sync Tube</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Sync Tube</h1>
      <p class="subtitle">YouTube 映像遅延</p>
    </header>

    <label class="toggle-row">
      <span>有効</span>
      <input type="checkbox" id="enabled" checked />
    </label>

    <section class="delay-section">
      <div class="delay-header">
        <label for="delayMs">映像遅延</label>
        <output id="delayValue" for="delayMs">0 ms</output>
      </div>
      <input
        type="range"
        id="delayMs"
        min="0"
        max="500"
        step="10"
        value="0"
      />
      <div class="presets" id="presets"></div>
    </section>

    <p class="hint warn">
      <strong>映像遅延は 1ms 以上</strong>にしてください（0 のときは何も起きません）。
    </p>
    <p class="hint">
      拡張を入れたあと、開いている YouTube タブは<strong>再読み込み</strong>が必要です。
    </p>
    <p class="hint">
      無線ヘッドホンで音が遅れる場合、スライダーを上げて口と音を合わせてください。
    </p>

    <label class="toggle-row debug-row">
      <span>デバッグログ</span>
      <input type="checkbox" id="debug" />
    </label>

    <script src="../sync-tube-constants.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
