<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SyncTube</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>SyncTube</h1>
      <p class="subtitle">YouTube video delay</p>
    </header>

    <label class="toggle-row">
      <span>Enabled</span>
      <input type="checkbox" id="enabled" checked />
    </label>

    <section class="delay-section">
      <div class="delay-header">
        <label for="delayMs">Video delay</label>
        <output id="delayValue" for="delayMs">0 ms</output>
      </div>
      <input
        type="range"
        id="delayMs"
        min="0"
        max="500"
        step="10"
        value="0"
      />
      <div class="presets" id="presets"></div>
    </section>

    <p class="hint warn">
      Set <strong>video delay to at least 1 ms</strong> (nothing happens at 0).
    </p>
    <p class="hint">
      After installing the extension, <strong>reload</strong> any open YouTube tabs.
    </p>
    <p class="hint">
      If wireless headphones make audio feel late, raise the slider to match lip sync.
    </p>

    <script src="../sync-tube-constants.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
