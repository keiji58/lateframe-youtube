<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LateFrame</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <svg width="26" height="26" viewBox="0 0 100 100" aria-hidden="true">
          <rect x="30" y="8" width="62" height="50" rx="12" fill="none" stroke="#00B074" stroke-width="7" opacity="0.45" />
          <rect x="8" y="34" width="62" height="50" rx="12" fill="#00B074" />
          <polygon points="32,48 32,70 52,59" fill="#fff" />
        </svg>
        <div>
          <h1>LateFrame</h1>
          <p class="subtitle" data-i18n="subtitle"></p>
        </div>
      </div>
      <label class="switch" data-i18n-title="enableToggle">
        <input type="checkbox" id="enabled" checked />
        <span class="track"><span class="knob"></span></span>
      </label>
    </header>

    <section class="delay-section">
      <div class="delay-readout">
        <output id="delayValue" for="delayMs">0</output><span class="unit">ms</span>
      </div>
      <p id="statusLine" class="status off"></p>
      <input
        type="range"
        id="delayMs"
        data-i18n-aria-label="delaySlider"
        min="0"
        max="500"
        step="10"
        value="0"
      />
      <div class="presets" id="presets"></div>
    </section>

    <details class="help">
      <summary data-i18n="howToUse"></summary>
      <ul>
        <li data-i18n="helpTip1"></li>
        <li data-i18n="helpTip2"></li>
        <li data-i18n="helpTip3"></li>
      </ul>
    </details>

    <script src="../late-frame-constants.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
